<div class="card">

    <h2>Descripción del Torneo</h2>
    <div class="alineado">
        <h3>Torneo:</h3>
        <label>{{ tournamentData.name }}</label>
    </div>

    <div class="alineado">
        <h3>Creado por:</h3>
        <label>{{ tournamentData.owner }}</label>
    </div>

    <div class="alineado">
        <h3>Estado:</h3>
        <label>{{ tournamentData.estado }}</label>
    </div>

    <div class="area">
        <h3>Descripción:</h3>
        <label>{{ tournamentData.description }}</label>
    </div>

    <div class="alineado">
        <h3>Categoría:</h3>
        <label>{{ tournamentData.category }}</label>
    </div>

    <div class="actions">
        <button type="button" (click)="close()">Cerrar</button>
        <button type="button" class="inscri" (click)="inscribirse()">Inscribirse</button>
    </div>

</div>
