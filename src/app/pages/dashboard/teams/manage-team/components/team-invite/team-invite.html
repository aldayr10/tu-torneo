<div class="invite-container">

  <div class="empty-state">
    <span class="material-symbols-outlined">
      schedule
    </span>

    <p>
      No hay solicitudes pendientes en este momento.
    </p>
  </div>

  <div class="invite-grid">

    <!-- CÓDIGO -->

    <div class="card code-card">

      <h3>
        <span>#</span>
        Código de Invitación
      </h3>

      <div class="box">

        <p>Comparte este código:</p>

        <div class="code-row">

          <div class="code">
            {{ team.code }}
          </div>

          <button
            type="button"
            class="copy-btn"
            (click)="copyCode()">

            <span class="material-symbols-outlined">
              content_copy
            </span>

          </button>

        </div>

        <small>
          Los jugadores lo ingresan en "Unirse a un Equipo"
        </small>

      </div>

    </div>

    <!-- LINK -->

    <div class="card link-card">

      <h3>
        <span class="material-symbols-outlined">
          link
        </span>

        Link Directo
      </h3>

      <div class="box">

        <p>O comparte este link:</p>

        <div class="code-row">

          <div class="link">
            {{ inviteLink }}
          </div>

          <button
            type="button"
            class="copy-btn"
            (click)="copyLink()">

            <span class="material-symbols-outlined">
              content_copy
            </span>

          </button>

        </div>

        <small>
          Click directo para solicitar unirse
        </small>

      </div>

    </div>

  </div>

</div>
