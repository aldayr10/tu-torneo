<div class="grid">

  <div class="card">
    <h3>Detalles del Equipo</h3>
    <p><strong>Nombre:</strong> {{ team.name }}</p>
    <p><strong>Categoría:</strong> {{ team.categoryId }}</p>
    <p><strong>Jugadores:</strong> {{ team.players?.length || 0 }}</p>
    <p><strong>Código de invitación:</strong> {{ team.invitationCode || team.code }}</p>
  </div>

</div>
