<div class="card">
  <h3>Invitar jugador al equipo</h3>
  <p>Ingresá el ID del jugador que querés invitar.</p>

  <form [formGroup]="form" (ngSubmit)="sendInvite()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>ID de jugador</mat-label>
      <input matInput type="number" formControlName="playerId" placeholder="Ej: 12" />
    </mat-form-field>

    @if (error) {
      <p class="error">{{ error }}</p>
    }
    @if (success) {
      <p class="success">{{ success }}</p>
    }

    <div class="dialog-actions">
      <button type="submit" [disabled]="form.invalid" mat-raised-button color="primary">
        Enviar invitación
      </button>
      <button type="button" mat-stroked-button color="warn" (click)="cancelSelection()">
        Cancelar
      </button>
    </div>
  </form>
</div>
