<div class="container">
  <h2>Eliminar jugador de un equipo</h2>
  <p>Seleccioná uno de tus equipos y el jugador a quitar.</p>

  @if (loading) {
    <p>Cargando equipos...</p>
  } @else if (teams.length === 0) {
    <p>No tenés equipos propios.</p>
  } @else {
    <label for="team">Equipo:</label>
    <select id="team" [(ngModel)]="selectedTeamId">
      <option [ngValue]="null">Seleccioná un equipo</option>
      @for (team of teams; track team.idTeam) {
        <option [ngValue]="team.idTeam">{{ team.name }} (#{{ team.idTeam }})</option>
      }
    </select>

    @if (selectedTeam) {
      <br><br>
      <label for="player">Jugador:</label>
      <select id="player" [(ngModel)]="selectedPlayerId">
        <option [ngValue]="null">Seleccioná un jugador</option>
        @for (player of (selectedTeam.players || []); track player.idPlayer) {
          <option [ngValue]="player.idPlayer">{{ player.name }} (#{{ player.idPlayer }})</option>
        }
      </select>
      <br><br>
      <button type="button" (click)="removePlayer()" [disabled]="!selectedPlayerId">Eliminar</button>
    }
  }

  @if (message) { <p class="success">{{ message }}</p> }
  @if (error) { <p class="error">{{ error }}</p> }
</div>
